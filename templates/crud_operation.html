{% extends "base.html" %}
{% load static %}

{% block page_title %}Add Product - Fitness Empire{% endblock %}
{% block page_id %}admin{% endblock %}

{% block 'main' %}
<section class="section">
    <div class="container container--narrow">

        <div class="panel">
            <h1 class="panel__title">Add Product</h1>

            <form action="" method="POST" enctype="multipart/form-data" class="form-body" novalidate>
                {% csrf_token %}

                <div class="form-grid">
                    <div class="field">
                        <label for="product-id">Product ID</label>
                        <input type="number" name="product-id" id="product-id" required placeholder="107">
                    </div>
                    <div class="field">
                        <label for="product-price">Price (&#8377;)</label>
                        <input type="number" name="product-price" id="product-price" required
                               step="0.01" min="0" placeholder="1299">
                    </div>
                    <div class="field field--full">
                        <label for="product-name">Product Name</label>
                        <input type="text" name="product-name" id="product-name" required
                               maxlength="255" placeholder="Empire Training Tee">
                    </div>
                    <div class="field field--full">
                        <label for="product-description">Description</label>
                        <textarea name="product-description" id="product-description" required
                                  placeholder="What it is, what it is made of, who it suits."></textarea>
                    </div>
                    <div class="field field--full">
                        <label for="product-image">Product Image</label>
                        <input type="file" name="product-image" id="product-image" accept="image/*">
                    </div>
                </div>

                <div class="cluster" style="margin-top:var(--sp-5);">
                    <button type="submit" class="btn">Save Product</button>
                    <a href="{% url 'showdetails' %}" class="btn btn--ghost">Cancel</a>
                </div>
            </form>
        </div>

    </div>
</section>
{% endblock 'main' %}
