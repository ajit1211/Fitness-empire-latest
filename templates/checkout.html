{% extends 'base.html' %}
{% load static %}

{% block 'main' %}
<style>
    .main-viewport {
        font-family: Arial, sans-serif;
        background-color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
    }
    .checkout-container {
        display: flex;
        flex-direction: column;
        background: #fff;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.2);
        width: 100%;
        max-width: 600px;
    }
    .customer-heading {
        font-size: 22px;
        font-weight: bold;
        color: #000;
        border-bottom: 3px solid crimson;
        padding-bottom: 5px;
        margin-bottom: 15px;
    }
    .form-group {
        color: #000;
        font-weight: bold;
        margin-bottom: 10px;
    }
    .form-group label {
        display: block;
        margin-bottom: 5px;
    }
    .form-group input, .form-group select, .form-group textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #bbb;
        border-radius: 6px;
        font-size: 16px;
    }
    .btn-submit {
        background: crimson;
        color: white;
        padding: 12px;
        font-size: 16px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        width: 100%;
        transition: background 0.3s;
    }
    .btn-submit:hover {
        background: darkred;
    }
</style>

<div class="main-viewport">
    <div class="checkout-container">
        {% if not form_filled %}
            <h2 class="customer-heading">Customer Details</h2>
            <form action="" method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label for="id_full_name">Full Name</label>
                    {{ form.full_name }}
                </div>
                <div class="form-group">
                    <label for="id_email">Email Address</label>
                    {{ form.email }}
                </div>
                <div class="form-group">
                    <label for="id_phone_number">Phone Number</label>
                    {{ form.phone_number }}
                </div>
                <div class="form-group">
                    <label for="id_address">Address</label>
                    {{ form.address }}
                </div>
                <div class="form-group">
                    <label for="id_city">City</label>
                    {{ form.city }}
                </div>
                <div class="form-group">
                    <label for="id_pin_code">PIN Code</label>
                    {{ form.pin_code }}
                </div>
                <div class="form-group">
                    <label for="id_country">Country</label>
                    {{ form.country }}
                </div>
                <button type="submit" class="btn-submit">Submit</button>
            </form>
        {% endif %}
    </div>
</div>
{% endblock 'main' %}
