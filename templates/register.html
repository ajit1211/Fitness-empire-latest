<style>
    /* Centering the card */
    .unique-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh; /* Full viewport height */
        background-color: transparent; /* Background can be adjusted if needed */
        margin-top: 40px;
        margin-bottom: 40px;
    }
    
    /* Card container */
    .stylish-card {
        background-color: #1e1e1e; /* Dark background for the message box */
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.8); /* Strong shadow */
        width: 400px;
        text-align: center;
        border: 1px solid #333;
    }
    
    /* Title */
    .stylish-card h2 {
        color: #e50914; /* Red title */
        font-size: 30px;
        margin-bottom: 20px;
        border-bottom: 2px solid #e50914; /* Red bottom border for title */
        display: inline-block;
        padding-bottom: 5px;
    }
    
    /* Form styling */
    .stylish-form {
        width: 100%;
    }
    
    .stylish-input {
        width: 100%;
        padding: 12px;
        margin: 12px 0;
        border: 1px solid #555;
        border-radius: 8px;
        font-size: 16px;
        background-color: #f5f5f5; /* Light gray for input background */
        color: #000; /* Black text for readability */
    }
    
    .stylish-input:focus {
        border-color: #e50914; /* Red border on focus */
        outline: none;
        box-shadow: 0 0 5px #e50914; /* Glow effect on focus */
    }
    
    /* Submit button */
    .stylish-submit-btn {
        background-color: #e50914; /* Red button */
        color: #fff;
        padding: 12px 20px;
        border: none;
        border-radius: 8px;
        font-size: 18px;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 10px;
        width: 100%;
    }
    
    .stylish-submit-btn:hover {
        background-color: #c2080b; /* Darker red on hover */
        box-shadow: 0 0 8px #e50914; /* Glow effect on hover */
    }
    
    /* Label styling */
    .stylish-label {
        font-size: 16px;
        color: black;
        display: block;
        margin-bottom: 8px;
        text-align: left;
        font-weight: bold;
    }
    
    /* Subtle text and links */
    .stylish-p {
        color: black;
        font-size: 14px;
        margin-top: 10px;
    }
    
    .stylish-a {
        color: #e50914;
        text-decoration: none;
    }
    
    .stylish-a:hover {
        text-decoration: underline;
    }
    
    /* Responsive styling */
    @media (max-width: 768px) {
        .stylish-card {
            width: 90%;
        }
    }
       /* Centering the Popup */
       #popup-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.7); /* Dark overlay */
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999; /* Ensure it's on top */
    }
    
    /* Styling the Popup Box */
    #popup-message {
        background-color: #1e1e1e; /* Dark background for the message box */
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.3);
        text-align: center;
        max-width: 400px;
        width: 90%;
        position: relative;
        z-index: 10000; /* Ensure it's on top of the overlay */
    }
    
    /* Error Message Text */
    .error-text {
        color: red;
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 20px;
    }
    
    /* Close Button (Styled as a Link) */
    .close-button {
        display: block;
        background-color: red;
        color: white;
        padding: 10px;
        text-decoration: none;
        border-radius: 5px;
        font-weight: bold;
        width: 100px;
        margin: 0 auto; /* Centers the button */
        text-align: center;
    }
    
    .close-button:hover {
        background-color: darkred;
    }
    
    </style>
    
    {% extends 'base.html' %}
    {% load static %}
    
    {% block 'main' %}
    {% if messages %}
            <div id="popup-overlay">
                <div id="popup-message">
                    {% for message in messages %}
                        <p class="error-text">{{ message }}</p>
                    {% endfor %}
                    <a href="{% url 'register' %}" class="close-button">OK</a>  
                </div>
            </div>
        {% endif %}

    <div class="unique-container">
        <div class="stylish-card">
            <h2>Register</h2>
            <form action="" method="POST" class="stylish-form">
                {% csrf_token %}
                {{ registerForm.as_p }}
                <input type="submit" value="Submit" class="stylish-submit-btn">
            </form>
        </div>
    </div>
    {% endblock 'main' %}
