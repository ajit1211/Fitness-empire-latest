<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #fff;
        }
        .container {
            display: flex;
            max-width: 900px;
            background: white;
            padding: 20px;
        }
        .product-image img {
            width: 100%;
            max-width: 300px;
        }
        .product-details {
            padding-left: 20px;
        }
        .price {
            color: blue;
            font-size: 24px;
            font-weight: bold;
        }
        .mrp {
            text-decoration: line-through;
            color: gray;
        }
        .discount {
            color: green;
        }
        .options {
            margin-top: 10px;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        .add-to-cart {
            background: white;
            border: 1px solid black;
        }
        .buy-now {
            background: black;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="product-image">
            <img src="gloves.png" alt="Puma Gloves">
        </div>
        <div class="product-details">
            <h2>Puma Unisex TR Ess Gym Gloves</h2>
            <p class="price">₹ 1609.00</p>
            <p class="mrp">₹ 2299.00 <span>Inclusive of all taxes</span></p>
            <p class="discount">You Save: ₹ 690. Discount: 30.01%</p>
            <div class="options">
                <p>COLOUR: <input type="text" value="03" disabled></p>
                <p>SIZE: <button>M</button> <button>L</button></p>
                <p>QUANTITY: <button>-</button> <input type="number" value="1" min="1" max="10"> <button>+</button></p>
            </div>
            <button class="btn add-to-cart">ADD TO CART</button>
            <button class="btn buy-now">BUY NOW</button>
            <p>AVAILABILITY: <span>In Stock</span></p>
            <p>BRAND: <strong>PUMA</strong></p>
        </div>
    </div>
</body>
</html>
